<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast Food Menu & Order</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Arial Black', Arial, sans-serif; background: #f4f4f4; max-width: 700px; margin: auto; border: 1px solid #ddd; position: relative; min-height: 100vh; }
        
        /* Orange Landing Screen */
        .scan-screen { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #FF5E1E; color: white; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; z-index: 2000; text-align: center; padding: 20px;
        }
        .qr-placeholder { 
            background: white; padding: 15px; border-radius: 12px; margin: 20px 0; 
            box-shadow: 0 8px 16px rgba(0,0,0,0.2); display: flex; justify-content: center; align-items: center;
        }
        .qr-placeholder img { width: 180px; height: 180px; display: block; border-radius: 4px; }

        .table-input-group { margin-top: 15px; }
        .table-input-group input { 
            padding: 10px; font-size: 16px; border-radius: 4px; border: none; width: 100px; text-align: center; font-weight: bold;
        }
        .table-input-group button { 
            padding: 10px 20px; font-size: 16px; background: #000; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-left: 5px;
        }

        /* Menu Display */
        .header { background: #FF5E1E; color: white; padding: 25px 20px; position: relative; }
        .header h3 { font-size: 20px; letter-spacing: 2px; }
        .header h1 { font-size: 48px; color: #000; line-height: 0.9; margin-top: 5px; }
        .table-badge { position: absolute; top: 20px; right: 20px; background: #000; color: #fff; padding: 6px 12px; font-family: sans-serif; font-size: 13px; border-radius: 4px; font-weight: bold; }

        .main-wrapper { display: flex; position: relative; background: #fff; }
        .sidebar { background: #000; width: 60px; color: white; writing-mode: vertical-rl; transform: rotate(180deg); text-align: center; font-size: 24px; letter-spacing: 5px; font-weight: bold; padding: 20px 0; }
        .content { flex: 1; padding: 20px; }

        .category-title { background: #FF5E1E; color: #000; display: inline-block; padding: 6px 20px; font-size: 16px; margin: 20px 0 10px 0; border-radius: 2px; text-transform: uppercase; }

        .menu-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 15px; color: #222; }
        .item-name { flex: 1; }
        .item-price { font-weight: bold; margin: 0 15px; }
        .add-btn { background: #28a745; color: white; border: none; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-family: sans-serif; font-weight: bold; }

        .images-column { width: 180px; padding: 10px; display: flex; flex-direction: column; gap: 15px; justify-content: flex-start; align-items: center; }
        .circle-img { width: 130px; height: 130px; border-radius: 50%; object-fit: cover; border: 4px solid #fff; box-shadow: 0 4px 8px rgba(0,0,0,0.15); }

        .cart-bar { background: #f8f9fa; border-top: 2px solid #FF5E1E; padding: 15px 20px; text-align: center; }
        .order-btn { background: #FF5E1E; color: white; border: none; width: 100%; padding: 12px; font-size: 16px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .status-box { background: #fff3cd; color: #856404; padding: 15px; margin: 15px; border-radius: 8px; border: 1px solid #ffeeba; font-family: sans-serif; text-align: left; }
        
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; padding: 20px; border-radius: 8px; width: 90%; max-width: 400px; font-family: sans-serif; }
    </style>
</head>
<body>

    <!-- LANDING SCREEN -->
    <div class="scan-screen" id="scan-screen">
        <h2>WELCOME TO FAST FOOD</h2>
        <p style="font-family: sans-serif; font-weight: normal; margin-top: 8px;">Scan your table's QR Code to open the menu</p>

        <div class="qr-placeholder">
            <img id="qr-img" src="/qr/1" alt="Table QR Code">
        </div>

        <p style="font-family: sans-serif; font-size: 14px;">Or enter your Table Number below:</p>
        <div class="table-input-group">
            <input type="number" id="manual-table-input" placeholder="Table #" min="1" value="1">
            <button onclick="accessMenuWithTable()">ENTER</button>
        </div>
    </div>

    <!-- MAIN MENU -->
    <div id="app-container" style="display: none;">
        <div class="header">
            <h3>FAST FOOD</h3>
            <h1>MENU</h1>
            <div class="table-badge" id="table-display">Table --</div>
        </div>

        <div class="main-wrapper">
            <div class="sidebar">RESTAURANT</div>

            <div class="content" id="menu-sections">
                Loading menu...
            </div>

            <div class="images-column" id="featured-images"></div>
        </div>

        <div id="tracking-section" class="status-box" style="display: none;">
            <h3>Live Order Tracker</h3>
            <p><strong>Order ID:</strong> #<span id="track-id">--</span></p>
            <p><strong>Status:</strong> <span id="track-status" style="font-weight: bold; color: #007bff;">Pending</span></p>
        </div>

        <div class="cart-bar">
            <h3 style="font-family: sans-serif; margin-bottom: 8px;">Total: ₱<span id="total-price">0.00</span></h3>
            <button class="order-btn" onclick="reviewOrder()">REVIEW ORDER</button>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="review-modal">
        <div class="modal-content">
            <h2>Confirm Your Order</h2>
            <hr style="margin: 10px 0;">
            <div id="modal-items-list" style="margin-bottom: 15px;"></div>
            <p><strong>Total:</strong> ₱<span id="modal-total">0.00</span></p>
            <button class="order-btn" onclick="submitOrder()" style="margin-top: 10px;">CONFIRM & PLACE ORDER</button>
            <button onclick="closeModal()" style="width: 100%; margin-top: 5px; padding: 8px; border: none; background: #dc3545; color: white; border-radius: 4px; cursor: pointer;">Cancel</button>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let tableNumber = urlParams.get('table');

        let cart = [];
        let total = 0;
        let activeOrderId = null;

        // Reliable image fallbacks based on item category/name
        const defaultImages = {
            'burgers': 'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=300&auto=format&fit=crop',
            'sides': 'https://images.unsplash.com/photo-1576107232684-1279f3908594?w=300&auto=format&fit=crop',
            'drinks': 'https://images.unsplash.com/photo-1551024709-8f23befc6f87?w=300&auto=format&fit=crop',
            'default': 'https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=300&auto=format&fit=crop'
        };

        if (tableNumber) {
            initMenu(tableNumber);
        } else {
            document.getElementById('manual-table-input').addEventListener('input', (e) => {
                const val = e.target.value || 1;
                document.getElementById('qr-img').src = `/qr/${val}?t=${new Date().getTime()}`;
            });
        }

        function accessMenuWithTable() {
            const inputVal = document.getElementById('manual-table-input').value;
            if (!inputVal) return alert('Please enter a table number');
            tableNumber = inputVal;
            initMenu(tableNumber);
        }

        function initMenu(table) {
            document.getElementById('scan-screen').style.display = 'none';
            document.getElementById('app-container').style.display = 'block';
            document.getElementById('table-display').innerText = `Table ${table}`;
            loadMenuItems();
        }

        function loadMenuItems() {
            fetch('/api/menu')
                .then(res => res.json())
                .then(data => {
                    const sectionsContainer = document.getElementById('menu-sections');
                    const imagesContainer = document.getElementById('featured-images');
                    sectionsContainer.innerHTML = '';
                    imagesContainer.innerHTML = '';

                    const categories = {};
                    data.forEach(item => {
                        const cat = item.category || 'Main Course';
                        if (!categories[cat]) categories[cat] = [];
                        categories[cat].push(item);
                    });

                    // Populate category sections
                    for (const [categoryName, items] of Object.entries(categories)) {
                        let sectionHtml = `<div class="category-title">${categoryName}</div>`;
                        items.forEach(item => {
                            sectionHtml += `
                                <div class="menu-row">
                                    <span class="item-name">${item.name}</span>
                                    <span class="item-price">₱${Number(item.price).toFixed(2)}</span>
                                    <button class="add-btn" onclick="addToCart('${item.name}', ${item.price})">+</button>
                                </div>
                            `;
                        });
                        sectionsContainer.innerHTML += sectionHtml;

                        // Render reliable high-quality category image on right sidebar
                        const catKey = categoryName.toLowerCase();
                        const imgSrc = defaultImages[catKey] || defaultImages['default'];
                        imagesContainer.innerHTML += `<img src="${imgSrc}" class="circle-img" alt="${categoryName}">`;
                    }
                })
                .catch(err => {
                    console.error('Error loading menu:', err);
                    document.getElementById('menu-sections').innerText = 'Failed to load menu.';
                });
        }

        function addToCart(name, price) {
            cart.push({ name, price: Number(price) });
            total += Number(price);
            document.getElementById('total-price').innerText = total.toFixed(2);
        }

        function reviewOrder() {
            if (!cart.length) return alert('Your cart is empty!');
            const modalList = document.getElementById('modal-items-list');
            modalList.innerHTML = cart.map(i => `<div style="display:flex; justify-content:space-between; margin-bottom:5px;"><span>${i.name}</span><span>₱${i.price.toFixed(2)}</span></div>`).join('');
            document.getElementById('modal-total').innerText = total.toFixed(2);
            document.getElementById('review-modal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('review-modal').style.display = 'none'; }

        function submitOrder() {
            fetch('/api/orders', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ table_number: tableNumber, total_amount: total })
            })
            .then(res => res.json())
            .then(data => {
                alert(data.message || 'Order placed successfully!');
                activeOrderId = data.orderId || data.order_id || data.insertId || 1;
                cart = [];
                total = 0;
                document.getElementById('total-price').innerText = '0.00';
                closeModal();
                startOrderTracking();
            })
            .catch(err => {
                console.error('Error submitting order:', err);
                alert('Order submitted!');
            });
        }

        function startOrderTracking() {
            document.getElementById('tracking-section').style.display = 'block';
            document.getElementById('track-id').innerText = activeOrderId;
            
            setInterval(() => {
                if (!activeOrderId) return;
                fetch(`/api/orders/${activeOrderId}`)
                    .then(res => res.json())
                    .then(order => {
                        if (order && order.status) {
                            document.getElementById('track-status').innerText = order.status;
                        }
                    })
                    .catch(err => console.error(err));
            }, 3000);
        }
    </script>
</body>
</html>
