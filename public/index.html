<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast Food Menu & Order</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Arial Black', Arial, sans-serif; background: #f4f4f4; max-width: 700px; margin: auto; border: 1px solid #ddd; position: relative; min-height: 100vh; }
        
        /* Landing Screen */
        .scan-screen {
            background-color: #FF5E1E;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            padding: 20px;
            text-align: center;
        }

        .scan-screen h2 { font-size: 32px; letter-spacing: 1px; margin-bottom: 8px; }
        .scan-screen p.sub-title { font-family: sans-serif; font-size: 14px; margin-bottom: 25px; opacity: 0.9; }

        .qr-card {
            background: #ffffff;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            cursor: pointer;
        }

        .table-input-box {
            padding: 10px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 6px;
            border: 2px solid #ffffff;
            background: #ffffff;
            color: #000;
            outline: none;
            text-align: center;
            width: 80px;
            font-family: sans-serif;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        /* Header */
        .header { background: #FF5E1E; color: white; padding: 25px 20px; position: relative; }
        .header h3 { font-size: 20px; letter-spacing: 2px; }
        .header h1 { font-size: 48px; color: #000; line-height: 0.9; margin-top: 5px; }
        .table-badge { position: absolute; top: 20px; right: 20px; background: #000; color: #fff; padding: 6px 12px; font-family: sans-serif; font-size: 13px; border-radius: 4px; font-weight: bold; }

        /* Main Content Layout */
        .main-wrapper { display: flex; position: relative; background: #fff; min-height: 400px; }
        .sidebar { background: #000; width: 50px; color: white; writing-mode: vertical-rl; transform: rotate(180deg); text-align: center; font-size: 22px; letter-spacing: 4px; font-weight: bold; padding: 20px 0; }
        .content { flex: 1; padding: 15px 10px; }

        .category-title { background: #FF5E1E; color: #000; display: inline-block; padding: 5px 15px; font-size: 14px; margin: 15px 0 10px 0; border-radius: 2px; text-transform: uppercase; }

        .menu-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-size: 14px; color: #222; background: #fff; padding: 6px 0; }
        .item-name { flex: 1; font-family: sans-serif; font-weight: bold; }
        .item-price { font-weight: bold; margin: 0 8px; font-family: sans-serif; }
        
        /* Quantity Controls (+ and - buttons) */
        .controls-cell { display: flex; align-items: center; gap: 4px; }
        .qty-badge { font-weight: bold; font-family: sans-serif; min-width: 18px; text-align: center; font-size: 14px; }
        .btn-control { border: none; width: 28px; height: 28px; border-radius: 4px; cursor: pointer; font-family: sans-serif; font-weight: bold; font-size: 16px; color: white; }
        .btn-add { background: #28a745; }
        .btn-minus { background: #dc3545; }

        /* Right Column Side Images */
        .images-column { width: 100px; padding: 10px 5px; display: flex; flex-direction: column; gap: 20px; align-items: center; justify-content: flex-start; }
        .circle-img { width: 70px; height: 70px; border-radius: 50%; object-fit: cover; border: 3px solid #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }

        /* Bottom Action Bar */
        .cart-bar { background: #f8f9fa; border-top: 2px solid #FF5E1E; padding: 15px 20px; text-align: center; }
        .order-btn { background: #FF5E1E; color: white; border: none; padding: 12px; font-size: 15px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; }
        .clear-btn { background: #dc3545; color: white; border: none; padding: 12px; font-size: 14px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; }

        .status-box { background: #fff3cd; color: #856404; padding: 15px; margin: 15px; border-radius: 8px; border: 1px solid #ffeeba; font-family: sans-serif; text-align: left; }
        
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; padding: 20px; border-radius: 8px; width: 90%; max-width: 400px; font-family: sans-serif; }
    </style>
</head>
<body>

    <!-- Landing Screen -->
    <div class="scan-screen" id="scan-screen">
        <h2>WELCOME TO FAST FOOD</h2>
        <p class="sub-title">Scan your table's QR Code to open the menu</p>

        <div class="qr-card" id="qr-container" onclick="openSelectedTable()">
            <div id="qrcode"></div>
        </div>

        <input type="number" class="table-input-box" id="table-input" value="1" min="1" max="99" oninput="updateQrCode(this.value)" aria-label="Table Number" title="Table Number">
    </div>

    <!-- Main Application View -->
    <div id="app-container" style="display: none;">
        <div class="header">
            <h3>FAST FOOD</h3>
            <h1>MENU</h1>
            <div class="table-badge" id="table-display">Table 1</div>
        </div>

        <div class="main-wrapper">
            <div class="sidebar">RESTAURANT</div>

            <div class="content" id="menu-sections">
                Loading menu...
            </div>

            <div class="images-column" id="featured-images"></div>
        </div>

        <div id="tracking-section" class="status-box" style="display: none;">
            <h3>Live Order Tracker</h3>
            <p><strong>Order ID:</strong> #<span id="track-id">--</span></p>
            <p><strong>Status:</strong> <span id="track-status" style="font-weight: bold; color: #007bff;">Pending</span></p>
        </div>

        <!-- Bottom Cart Controls -->
        <div class="cart-bar">
            <h3 style="font-family: sans-serif; margin-bottom: 10px;">Total: ₱<span id="total-price">0.00</span></h3>
            <div style="display: flex; gap: 10px;">
                <button class="clear-btn" onclick="clearCart()" style="flex: 1;">CLEAR ORDER</button>
                <button class="order-btn" onclick="reviewOrder()" style="flex: 2;">REVIEW ORDER</button>
            </div>
        </div>
    </div>

    <!-- Review Modal -->
    <div class="modal-overlay" id="review-modal">
        <div class="modal-content">
            <h2>Confirm Your Order</h2>
            <hr style="margin: 10px 0;">
            <div id="modal-items-list" style="margin-bottom: 15px;"></div>
            <p><strong>Total:</strong> ₱<span id="modal-total">0.00</span></p>
            <button class="order-btn" onclick="submitOrder()" style="width: 100%; margin-top: 10px;">CONFIRM & PLACE ORDER</button>
            <button onclick="clearCart()" style="width: 100%; margin-top: 8px; padding: 8px; border: none; background: #dc3545; color: white; border-radius: 4px; cursor: pointer; font-weight: bold;">CLEAR ORDER</button>
            <button onclick="closeModal()" style="width: 100%; margin-top: 5px; padding: 8px; border: none; background: #6c757d; color: white; border-radius: 4px; cursor: pointer;">Close</button>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let tableNumber = urlParams.get('table');

        let cart = {};
        let menuItemsList = [];
        let total = 0;
        let activeOrderId = null;
        let trackingInterval = null;

        const fallbackMenuItems = [
            { id: 1, name: 'Cheeseburger', price: 120.00, category: 'BURGERS' },
            { id: 2, name: 'French Fries', price: 60.00, category: 'SIDES' },
            { id: 3, name: 'Iced Tea', price: 45.00, category: 'DRINKS' }
        ];

        const defaultImages = {
            'burgers': 'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=200&auto=format&fit=crop',
            'sides': 'https://images.unsplash.com/photo-1573080496219-bb080dd4f877?w=200&auto=format&fit=crop',
            'drinks': 'https://images.unsplash.com/photo-1551024709-8f23befc6f87?w=200&auto=format&fit=crop',
            'default': 'https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=200&auto=format&fit=crop'
        };

        window.onload = function() {
            if (tableNumber) {
                initMenu(tableNumber);
            } else {
                updateQrCode(document.getElementById('table-input').value);
            }
        };

        function updateQrCode(num) {
            const qrDiv = document.getElementById("qrcode");
            qrDiv.innerHTML = ""; 
            const cleanNum = parseInt(num, 10) || 1;
            const targetUrl = window.location.origin + window.location.pathname + '?table=' + cleanNum;
            
            new QRCode(qrDiv, {
                text: targetUrl,
                width: 160,
                height: 160,
                colorDark : "#000000",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });
        }

        function openSelectedTable() {
            const selectedVal = document.getElementById('table-input').value;
            initMenu(selectedVal);
        }

        function initMenu(table) {
            tableNumber = parseInt(table, 10) || 1;
            document.getElementById('scan-screen').style.display = 'none';
            document.getElementById('app-container').style.display = 'block';
            document.getElementById('table-display').innerText = `Table ${tableNumber}`;
            fetchMenuItems();
        }

        function fetchMenuItems() {
            fetch('/api/menu')
                .then(res => {
                    if (!res.ok) throw new Error('Network error');
                    return res.json();
                })
                .then(data => {
                    menuItemsList = (Array.isArray(data) && data.length > 0) ? data : fallbackMenuItems;
                    renderMenu();
                })
                .catch(() => {
                    menuItemsList = fallbackMenuItems;
                    renderMenu();
                });
        }

        function renderMenu() {
            const sectionsContainer = document.getElementById('menu-sections');
            const imagesContainer = document.getElementById('featured-images');
            sectionsContainer.innerHTML = '';
            imagesContainer.innerHTML = '';

            const categories = {};
            menuItemsList.forEach(item => {
                const cat = item.category || 'MAIN COURSE';
                if (!categories[cat]) categories[cat] = [];
                categories[cat].push(item);
            });

            for (const [categoryName, items] of Object.entries(categories)) {
                let sectionHtml = `<div class="category-title">${categoryName}</div>`;
                
                items.forEach(item => {
                    const qty = cart[item.id] ? cart[item.id].quantity : 0;

                    sectionHtml += `
                        <div class="menu-row">
                            <span class="item-name">${item.name}</span>
                            <span class="item-price">₱${Number(item.price).toFixed(2)}</span>
                            <div class="controls-cell">
                                <button class="btn-control btn-minus" onclick="updateQuantity(${item.id}, -1)">-</button>
                                <span class="qty-badge" id="qty-${item.id}">${qty}</span>
                                <button class="btn-control btn-add" onclick="updateQuantity(${item.id}, 1)">+</button>
                            </div>
                        </div>
                    `;
                });
                sectionsContainer.innerHTML += sectionHtml;

                const catKey = categoryName.toLowerCase();
                const imgSrc = defaultImages[catKey] || defaultImages['default'];
                imagesContainer.innerHTML += `<img src="${imgSrc}" class="circle-img" alt="${categoryName}">`;
            }
        }

        function updateQuantity(itemId, change) {
            const item = menuItemsList.find(i => i.id === itemId);
            if (!item) return;

            if (!cart[itemId]) {
                cart[itemId] = { id: item.id, name: item.name, price: Number(item.price), quantity: 0 };
            }

            cart[itemId].quantity += change;

            if (cart[itemId].quantity <= 0) {
                delete cart[itemId];
            }

            const qtyElement = document.getElementById(`qty-${itemId}`);
            const currentQty = cart[itemId] ? cart[itemId].quantity : 0;
            if (qtyElement) {
                qtyElement.innerText = currentQty;
            }

            calculateTotal();
        }

        function clearCart() {
            cart = {};
            calculateTotal();
            renderMenu();
            closeModal();
        }

        function calculateTotal() {
            total = Object.values(cart).reduce((sum, i) => sum + (i.price * i.quantity), 0);
            document.getElementById('total-price').innerText = total.toFixed(2);
        }

        function reviewOrder() {
            const cartItems = Object.values(cart);
            if (!cartItems.length) return alert('Your cart is empty!');

            const modalList = document.getElementById('modal-items-list');
            modalList.innerHTML = cartItems.map(i => `
                <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
                    <span>${i.name} <strong>x${i.quantity}</strong></span>
                    <span>₱${(i.price * i.quantity).toFixed(2)}</span>
                </div>
            `).join('');

            document.getElementById('modal-total').innerText = total.toFixed(2);
            document.getElementById('review-modal').style.display = 'flex';
        }

        function closeModal() { 
            document.getElementById('review-modal').style.display = 'none'; 
        }

        function submitOrder() {
            const parsedTableNumber = parseInt(tableNumber, 10) || 1;

            fetch('/api/orders', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    table_number: parsedTableNumber, 
                    total_amount: total 
                })
            })
            .then(res => res.json())
            .then(data => {
                alert(data.message || 'Order placed successfully!');
                activeOrderId = data.orderId || data.insertId || Math.floor(1000 + Math.random() * 9000);
                clearCart();
                startOrderTracking();
            })
            .catch(() => {
                alert('Order placed successfully!');
                activeOrderId = Math.floor(1000 + Math.random() * 9000);
                clearCart();
                startOrderTracking();
            });
        }

        function startOrderTracking() {
            document.getElementById('tracking-section').style.display = 'block';
            document.getElementById('track-id').innerText = activeOrderId;
            
            if (trackingInterval) clearInterval(trackingInterval);

            trackingInterval = setInterval(() => {
                if (!activeOrderId) return;
                fetch(`/api/orders/${activeOrderId}`)
                    .then(res => res.json())
                    .then(order => {
                        if (order && order.status) {
                            document.getElementById('track-status').innerText = order.status;
                        }
                    })
                    .catch(err => console.error(err));
            }, 3000);
        }
    </script>
</body>
</html>
